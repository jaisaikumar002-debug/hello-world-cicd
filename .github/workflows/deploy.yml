
name: Deploy Hello World to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Application using AWS SSM
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          APP_URL="https://raw.githubusercontent.com/jaisaikumar002-debug/hello-world-cicd/${GITHUB_SHA}/index.html"

          echo "Downloading HTML from commit: ${GITHUB_SHA}"

          PARAMETERS=$(jq -n --arg url "$APP_URL" '{
            commands: [
              "set -e",
              "dnf install nginx -y",
              "mkdir -p /usr/share/nginx/html",
              ("curl -fsSL " + $url + " -o /tmp/index.html"),
              "install -m 0644 /tmp/index.html /usr/share/nginx/html/index.html",
              "systemctl enable nginx",
              "systemctl restart nginx",
              "systemctl is-active nginx",
              "cmp -s /tmp/index.html /usr/share/nginx/html/index.html",
              "curl -fsS http://localhost/ -o /tmp/website-output.html",
              "cmp -s /tmp/index.html /tmp/website-output.html",
              "echo Deployment verification successful",
              "cat /usr/share/nginx/html/index.html"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in {1..36}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              break
            fi

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json || true

            exit 1
          fi

          echo "Deployment completed successfully!"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
